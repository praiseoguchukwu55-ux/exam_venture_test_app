<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Videos | Admin</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="admin-header">
        <div class="container">
            <div class="header-actions">
                <div>
                    <h1>Admin Dashboard</h1>
                    <p>Manage Videos</p>
                </div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="admin-nav">
            <a href="index.html" class="nav-link-admin">Dashboard</a>
            <a href="messages.html" class="nav-link-admin">Messages</a>
            <a href="videos.html" class="nav-link-admin active">Videos</a>
            <a href="songs.html" class="nav-link-admin">Songs</a>
            <a href="ebooks.html" class="nav-link-admin">E-Books</a>
            <a href="links.html" class="nav-link-admin">Links</a>
            <a href="people.html" class="nav-link-admin">People</a>
            <a href="radio.html" class="nav-link-admin">Radio</a>
            <a href="images.html" class="nav-link-admin">Images</a>
        </div>

        <div class="admin-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 class="section-title">Videos</h2>
                <button class="btn btn-primary" onclick="openAddModal()">+ Add New Video</button>
            </div>

            <div id="alert" class="alert"></div>

            <div class="items-container" id="videosContainer">
                <!-- Videos will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="modal-header">Add New Video</div>

            <form onsubmit="saveVideo(event)">
                <div class="form-group">
                    <label for="videoTitle">Title</label>
                    <input type="text" id="videoTitle" required>
                </div>

                <div class="form-group">
                    <label for="videoDescription">Description</label>
                    <textarea id="videoDescription" required></textarea>
                </div>

                <div class="form-group">
                    <label for="videoUrl">Video URL (YouTube, Vimeo, etc.)</label>
                    <input type="text" id="videoUrl" placeholder="https://youtube.com/watch?v=...">
                </div>

                <div class="form-group">
                    <label>Thumbnail Image (optional)</label>
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <button type="button" class="btn btn-secondary" onclick="uploadImageVideo()" style="flex: 1;">Upload New Image</button>
                        <button type="button" class="btn btn-secondary" onclick="selectImageVideo()" style="flex: 1;">Select from Library</button>
                    </div>
                    <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color);">
                        <label for="videoImageUrl" style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-secondary); font-size: 13px;">Or paste server image URL:</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="videoImageUrl" placeholder="https://yourserver.com/images/thumbnail.jpg" style="flex: 1;">
                            <button type="button" class="btn btn-secondary" onclick="setVideoImageUrl()" style="flex: 0 0 auto;">Add URL</button>
                        </div>
                    </div>
                    <div id="videoImagePreview" style="margin-top: 10px; padding: 10px; background: var(--input-bg); border-radius: 4px; min-height: 30px; display: flex; align-items: center; color: var(--text-light); font-size: 14px;">
                        No image selected
                    </div>
                    <input type="hidden" id="videoImage">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Video</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin-data.js"></script>
    <script>
        let currentEditId = null;

        if (!sessionStorage.getItem('adminLoggedIn')) {
            window.location.href = 'login.html';
        }

        async function loadVideos() {
            const videos = await AdminData.getVideos();
            const container = document.getElementById('videosContainer');
            container.innerHTML = '';

            if (videos.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-light);">No videos yet. Click "Add New Video" to create one.</p>';
                return;
            }

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <h3>${escapeHtml(video.title)}</h3>
                    <p>${escapeHtml(video.description)}</p>
                    <p style="font-size: 12px; color: var(--text-light); margin-top: 8px;">
                        ${video.videoUrl ? '✓ Video URL linked' : 'No video URL'}
                    </p>
                    <div class="card-actions">
                        <button class="btn btn-primary btn-small" onclick="editVideo(${video.id})">Edit</button>
                        <button class="btn btn-danger btn-small" onclick="deleteVideo(${video.id})">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openAddModal() {
            currentEditId = null;
            document.getElementById('videoModal').querySelector('.modal-header').textContent = 'Add New Video';
            document.getElementById('videoTitle').value = '';
            document.getElementById('videoDescription').value = '';
            document.getElementById('videoUrl').value = '';
            document.getElementById('videoImage').value = '';
            document.getElementById('videoImagePreview').textContent = 'No image selected';
            document.getElementById('videoModal').classList.add('show');
        }

        async function editVideo(id) {
            const videos = await AdminData.getVideos();
            const video = videos.find(v => v.id == id);
            if (!video) return;

            currentEditId = id;
            document.getElementById('videoModal').querySelector('.modal-header').textContent = 'Edit Video';
            document.getElementById('videoTitle').value = video.title;
            document.getElementById('videoDescription').value = video.description;
            document.getElementById('videoUrl').value = video.videoUrl || '';
            document.getElementById('videoImage').value = video.image || '';
            
            if (video.image) {
                document.getElementById('videoImagePreview').textContent = '✓ Image ID: ' + video.image;
            } else {
                document.getElementById('videoImagePreview').textContent = 'No image selected';
            }
            document.getElementById('videoModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('videoModal').classList.remove('show');
        }

        async function saveVideo(event) {
            event.preventDefault();

            const title = document.getElementById('videoTitle').value;
            const description = document.getElementById('videoDescription').value;
            const videoUrl = document.getElementById('videoUrl').value;
            const image = document.getElementById('videoImage').value;

            const videoData = {
                title,
                description,
                videoUrl: videoUrl || '',
                image: image || ''
            };

            try {
                if (currentEditId) {
                    await AdminData.updateVideo(currentEditId, videoData);
                    showAlert('Video updated successfully!', 'success');
                } else {
                    await AdminData.addVideo(videoData);
                    showAlert('Video added successfully!', 'success');
                }

                closeModal();
                await loadVideos();
            } catch (error) {
                showAlert('Error saving video: ' + (error.message || 'Unknown error'), 'error');
                console.error('Save error:', error);
            }
        }

        async function deleteVideo(id) {
            if (confirm('Are you sure you want to delete this video?')) {
                try {
                    await AdminData.deleteVideo(id);
                    showAlert('Video deleted successfully!', 'success');
                    await loadVideos();
                } catch (error) {
                    showAlert('Error deleting video: ' + (error.message || 'Unknown error'), 'error');
                    console.error('Delete error:', error);
                }
            }
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert show alert-${type}`;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 4000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setVideoImageUrl() {
            const url = document.getElementById('videoImageUrl').value.trim();
            if (!url) {
                alert('Please enter an image URL');
                return;
            }

            try {
                new URL(url);
            } catch (e) {
                alert('Please enter a valid URL');
                return;
            }

            document.getElementById('videoImage').value = url;
            document.getElementById('videoImageUrl').value = '';
            document.getElementById('videoImagePreview').textContent = '✓ Image URL: ' + url;
        }

        function uploadImageVideo() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file.type.startsWith('image/')) {
                    alert('Please select an image file');
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    alert('Image must be smaller than 5MB');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const imageData = {
                        id: Date.now().toString(),
                        name: file.name,
                        data: event.target.result,
                        type: file.type,
                        size: file.size,
                        category: 'videos',
                        uploadedAt: new Date().toISOString()
                    };
                    
                    AdminData.addImage(imageData);
                    document.getElementById('videoImage').value = imageData.id;
                    document.getElementById('videoImagePreview').textContent = '✓ ' + file.name;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function selectImageVideo() {
            const images = AdminData.getAllImages();
            if (images.length === 0) {
                alert('No images uploaded yet. Please upload an image first in the Images section.');
                return;
            }
            
            const imageList = images.map(img => `${img.id}: ${img.name}`).join('\n');
            const selectedId = prompt('Enter the Image ID from the Images section:\n\n' + imageList, '');
            if (selectedId) {
                const image = AdminData.getImageById(selectedId);
                if (image) {
                    document.getElementById('videoImage').value = image.id;
                    document.getElementById('videoImagePreview').textContent = '✓ Image ID: ' + image.id + ' (' + image.name + ')';
                } else {
                    alert('Image ID not found');
                }
            }
        }

        loadVideos().catch(error => console.error('Failed to load videos:', error));

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            window.location.href = 'login.html';
        }

        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
