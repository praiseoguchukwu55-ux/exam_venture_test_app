<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People Database | Admin</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="admin-header">
        <div class="container">
            <div class="header-actions">
                <div>
                    <h1>Admin Dashboard</h1>
                    <p>People Database</p>
                </div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="admin-nav">
            <a href="index.html" class="nav-link-admin">Dashboard</a>
            <a href="messages.html" class="nav-link-admin">Messages</a>
            <a href="videos.html" class="nav-link-admin">Videos</a>
            <a href="songs.html" class="nav-link-admin">Songs</a>
            <a href="ebooks.html" class="nav-link-admin">E-Books</a>
            <a href="links.html" class="nav-link-admin">Links</a>
            <a href="people.html" class="nav-link-admin active">People</a>
            <a href="radio.html" class="nav-link-admin">Radio</a>
            <a href="images.html" class="nav-link-admin">Images</a>
        </div>

        <div class="admin-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 15px; flex-wrap: wrap;">
                <h2 class="section-title">People Database</h2>
                <button class="btn btn-primary" onclick="openAddModal()">+ Add New Person</button>
            </div>

            <div id="alert" class="alert"></div>

            <div class="table-responsive">
                <table class="content-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Contact No</th>
                            <th>Email</th>
                            <th>School Address</th>
                            <th>Home Address</th>
                            <th>Department</th>
                            <th>Level</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="peopleTableBody">
                        <!-- People records will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="personModal" class="modal">
        <div class="modal-content" style="max-width: 760px;">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="modal-header">Add New Person</div>

            <form onsubmit="savePerson(event)">
                <div class="form-group">
                    <label for="personName">Name</label>
                    <input type="text" id="personName" required>
                </div>

                <div class="form-group">
                    <label for="personContact">Contact No</label>
                    <input type="tel" id="personContact" required>
                </div>

                <div class="form-group">
                    <label for="personEmail">Email</label>
                    <input type="email" id="personEmail" required>
                </div>

                <div class="form-group">
                    <label for="personSchoolAddress">School Address</label>
                    <textarea id="personSchoolAddress" required></textarea>
                </div>

                <div class="form-group">
                    <label for="personHomeAddress">Home Address</label>
                    <textarea id="personHomeAddress" required></textarea>
                </div>

                <div class="form-group">
                    <label for="personDepartment">Department</label>
                    <input type="text" id="personDepartment" placeholder="Department or unit">
                </div>

                <div class="form-group">
                    <label for="personLevel">Level</label>
                    <input type="text" id="personLevel" placeholder="Level or position">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Person</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin-data.js"></script>
    <script>
        let currentEditId = null;

        if (!sessionStorage.getItem('adminLoggedIn')) {
            window.location.href = 'login.html';
        }

        async function loadPeople() {
            const people = await AdminData.getPeople();
            const tableBody = document.getElementById('peopleTableBody');
            tableBody.innerHTML = '';

            if (people.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-light);">No people records yet. Click "Add New Person" to create one.</td></tr>';
                return;
            }

            people.forEach(person => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${escapeHtml(person.name)}</td>
                    <td>${escapeHtml(person.contactNo)}</td>
                    <td>${escapeHtml(person.email)}</td>
                    <td>${escapeHtml(person.schoolAddress)}</td>
                    <td>${escapeHtml(person.homeAddress)}</td>
                    <td>${escapeHtml(person.department || '')}</td>
                    <td>${escapeHtml(person.level || '')}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-primary btn-small" onclick="editPerson(${person.id})">Edit</button>
                            <button class="btn btn-danger btn-small" onclick="deletePerson(${person.id})">Delete</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function openAddModal() {
            currentEditId = null;
            document.querySelector('#personModal .modal-header').textContent = 'Add New Person';
            document.getElementById('personName').value = '';
            document.getElementById('personContact').value = '';
            document.getElementById('personEmail').value = '';
            document.getElementById('personSchoolAddress').value = '';
            document.getElementById('personHomeAddress').value = '';
            document.getElementById('personDepartment').value = '';
            document.getElementById('personLevel').value = '';
            document.getElementById('personModal').classList.add('show');
        }

        async function editPerson(id) {
            const people = await AdminData.getPeople();
            const person = people.find(p => p.id == id);
            if (!person) return;

            currentEditId = id;
            document.querySelector('#personModal .modal-header').textContent = 'Edit Person';
            document.getElementById('personName').value = person.name || '';
            document.getElementById('personContact').value = person.contactNo || '';
            document.getElementById('personEmail').value = person.email || '';
            document.getElementById('personSchoolAddress').value = person.schoolAddress || '';
            document.getElementById('personHomeAddress').value = person.homeAddress || '';
            document.getElementById('personDepartment').value = person.department || '';
            document.getElementById('personLevel').value = person.level || '';
            document.getElementById('personModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('personModal').classList.remove('show');
        }

        async function savePerson(event) {
            event.preventDefault();

            const personData = {
                name: document.getElementById('personName').value.trim(),
                contactNo: document.getElementById('personContact').value.trim(),
                email: document.getElementById('personEmail').value.trim(),
                schoolAddress: document.getElementById('personSchoolAddress').value.trim(),
                homeAddress: document.getElementById('personHomeAddress').value.trim(),
                department: document.getElementById('personDepartment').value.trim(),
                level: document.getElementById('personLevel').value.trim()
            };

            try {
                if (currentEditId) {
                    await AdminData.updatePerson(currentEditId, personData);
                    showAlert('Person record updated successfully!', 'success');
                } else {
                    await AdminData.addPerson(personData);
                    showAlert('Person record added successfully!', 'success');
                }

                closeModal();
                await loadPeople();
            } catch (error) {
                showAlert('Error saving person: ' + (error.message || 'Unknown error'), 'error');
                console.error('Save error:', error);
            }
        }

        async function deletePerson(id) {
            if (confirm('Are you sure you want to delete this person record?')) {
                try {
                    await AdminData.deletePerson(id);
                    showAlert('Person record deleted successfully!', 'success');
                    await loadPeople();
                } catch (error) {
                    showAlert('Error deleting person: ' + (error.message || 'Unknown error'), 'error');
                    console.error('Delete error:', error);
                }
            }
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert show alert-${type}`;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 4000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadPeople().catch(error => console.error('Failed to load people:', error));

        function logout() {
            sessionStorage.removeItem('adminLoggedIn');
            window.location.href = 'login.html';
        }

        document.getElementById('personModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
